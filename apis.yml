name: Nlight
description: 'nLIGHT, Inc. (NASDAQ: LASR) is a US-based designer and manufacturer of
  high-power semiconductor and fiber lasers, optical fibers, and beam-control systems.
  For more than 25 years the company has served mission-critical directed-energy and
  defense, sensing, and advanced-manufacturing markets (cutting, welding, additive,
  medical, and battery production) from a vertically integrated stack spanning semiconductor
  chips to complete laser systems, with a portfolio of over 450 patents and design and
  manufacturing based in Camas, Washington. nLIGHT is a hardware and photonics company
  and publishes no public developer API, SDK, or developer portal.'
